# Standalone workspace so the test crate's heavy litesvm/agave dependencies can
# never affect the SBF program build or its rustc version.
[workspace]

[package]
name = "token-ledger-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "token_ledger_contract_tests"
path = "src/lib.rs"

# Versions pinned to litesvm 0.17's own solana dependency set.
[dependencies]
litesvm = "0.17.0"
solana-address = "~2.7.0"
solana-account = "4.7"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-instruction = "~3.5.0"
solana-signer = "3.0.1"
spl-token-interface = "3.0.0"
solana-program-pack = "3.1.0"
solana-program-option = "3.1.0"
solana-clock = "~3.2"
sha2 = "0.10"

# solana-keypair 3.1.2 -> five8 1.0.0 -> five8_core 0.1.2, whose
# `impl std::error::Error for DecodeError` is behind this non-default feature.
five8_core = { version = "0.1.2", features = ["std"] }
