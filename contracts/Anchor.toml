[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
service_balance = "GgYegKVx47vYApyQijG6g4k2pAGGJ6ub9DUhKUE4gZYo"
treasury_payables = "5k5vSj1LWFLZ6doBfdwyYnxHKTpt1ot4SmBroby6ZqRi"

[programs.devnet]
service_balance = "GgYegKVx47vYApyQijG6g4k2pAGGJ6ub9DUhKUE4gZYo"
treasury_payables = "5k5vSj1LWFLZ6doBfdwyYnxHKTpt1ot4SmBroby6ZqRi"

[provider]
# Devnet by default. The app resolves the cluster, program IDs, mint and token
# program from src config, never from user input.
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Program unit tests (invariants) in the root workspace, then the litesvm
# integration tests in their standalone workspace. The latter is separate so its
# heavy litesvm/agave dependencies cannot affect the SBF program build.
test = "cargo test && (cd tests && cargo test)"

# The IDL and TypeScript types are the client contract and are committed under
# contracts/idl and contracts/types (target/ is gitignored). Regenerate with:
#   anchor idl build -p service_balance -o idl/service_balance.json -t types/service_balance.ts
#   anchor idl build -p treasury_payables -o idl/treasury_payables.json -t types/treasury_payables.ts

[workspace]
members = ["programs/*"]
