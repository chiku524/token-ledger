[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
service_balance = "DVRsqtJNpDA31QRdoSkfGb2wynCWs4cWoe3NCSNjpeXb"
treasury_payables = "33YoPF5P1v9qkgMpzPTHtWnCcA9u9eE9iv6xutWRyZCs"

[programs.devnet]
service_balance = "DVRsqtJNpDA31QRdoSkfGb2wynCWs4cWoe3NCSNjpeXb"
treasury_payables = "33YoPF5P1v9qkgMpzPTHtWnCcA9u9eE9iv6xutWRyZCs"

[provider]
# Devnet by default. The app resolves the cluster, program IDs, mint and token
# program from src config, never from user input.
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

# The IDL and TypeScript types are the client contract and are committed under
# contracts/idl and contracts/types (target/ is gitignored). Regenerate with:
#   anchor idl build -p service_balance -o idl/service_balance.json -t types/service_balance.ts
#   anchor idl build -p treasury_payables -o idl/treasury_payables.json -t types/treasury_payables.ts

[workspace]
members = ["programs/*"]
