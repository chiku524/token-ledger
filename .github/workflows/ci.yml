name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check committed migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts is out of sync with drizzle/. Run 'pnpm db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/token_ledger
      - name: Load seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/token_ledger
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
