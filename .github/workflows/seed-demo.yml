# Manually reload the Harbourline example org into the production Postgres
# used by Cloudflare Workers (secrets.DATABASE_URL / Hyperdrive origin).
# Safe: seed replaces only org_harbourline; other organizations are left alone.
name: Seed demo books

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate production database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed Harbourline example books
        continue-on-error: true
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Repair Harbourline demo passwords
        run: pnpm exec tsx scripts/repair-harbourline-passwords.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Confirm Harbourline demo owner password
        run: pnpm exec tsx scripts/confirm-harbourline-seed.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
